name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Backend Verify (SpotBugs, JaCoCo, JUnit)
      run: |
        cd backend
        mvn -B clean verify

    - name: Frontend Build
      run: |
        cd frontend
        npm ci
        npm run build -- --configuration production

    - name: Security Audit SQL Dynamic
      run: |
        chmod +x scripts/audit-sql-dynamic.sh
        ./scripts/audit-sql-dynamic.sh
