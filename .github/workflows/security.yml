name: OWASP ZAP Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Scan the web application
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      # Aquí iría el paso para levantar tu backend localmente antes de probar.
      # Por simplicidad, se asume un despliegue de staging o se arranca con Docker.
      # - name: Start Backend
      #   run: docker-compose up -d

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080/v3/api-docs' # API Specs target
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          
      # Las reglas personalizadas o de exclusión se almacenarían en .zap/rules.tsv
