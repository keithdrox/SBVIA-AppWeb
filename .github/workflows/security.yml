name: OWASP ZAP Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Escaneo de seguridad de la API
    timeout-minutes: 20
    env:
      DB_USER: sbvia_ci
      DB_PASSWORD: sbvia_ci_password
      JWT_SECRET: ci_only_jwt_secret_with_more_than_sixty_four_characters_1234567890

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Levantar la API y sus dependencias
        run: docker compose up -d --build postgres redis backend

      - name: Esperar hasta que la API responda
        shell: bash
        run: |
          for intento in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then
              echo "API lista tras $intento intentos"
              exit 0
            fi
            sleep 4
          done
          docker compose logs backend
          exit 1

      - name: Ejecutar OWASP ZAP contra OpenAPI
        run: |
          mkdir -p zap-results
          chmod 777 zap-results
          docker run --rm --network host \
            --volume "${{ github.workspace }}/zap-results:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://localhost:8080/api/docs \
            -f openapi \
            -I \
            -r zap-report.html \
            -J zap-report.json

      - name: Guardar el informe de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-owasp-zap
          path: |
            zap-results/zap-report.html
            zap-results/zap-report.json
          if-no-files-found: warn

      - name: Apagar los servicios
        if: always()
        run: docker compose down --volumes
