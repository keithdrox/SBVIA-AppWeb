<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>SBVIA</h2>
      <p>Crear Cuenta Nueva</p>
    </div>
    
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          [(ngModel)]="data.nombre" 
          required>
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input 
          type="text" 
          id="apellido" 
          name="apellido" 
          [(ngModel)]="data.apellido" 
          required>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="data.email" 
          required 
          placeholder="ejemplo@correo.com">
      </div>
      
      <div class="form-group">
        <label for="telefono">Teléfono</label>
        <input 
          type="tel" 
          id="telefono" 
          name="telefono" 
          [(ngModel)]="data.telefono" 
          required 
          placeholder="Ej: +51 987654321">
      </div>

      <div class="form-group">
        <label for="tipoLicencia">Tipo de Licencia</label>
        <select 
          id="tipoLicencia" 
          name="tipoLicencia" 
          [(ngModel)]="data.tipoLicencia" 
          required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="A-I">Clase A - Categoría I (Particular)</option>
          <option value="A-IIa">Clase A - Categoría II-A (Taxis, etc.)</option>
          <option value="A-IIb">Clase A - Categoría II-B (Microbuses)</option>
          <option value="A-IIIa">Clase A - Categoría III-A (Buses)</option>
          <option value="A-IIIb">Clase A - Categoría III-B (Carga)</option>
          <option value="A-IIIc">Clase A - Categoría III-C (Carga y Pasajeros)</option>
          <option value="B-I">Clase B - Categoría I (Triciclos motorizados)</option>
          <option value="B-IIa">Clase B - Categoría II-A (Bimotor, etc.)</option>
          <option value="B-IIb">Clase B - Categoría II-B (Motos)</option>
          <option value="B-IIc">Clase B - Categoría II-C (Mototaxis)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="data.password" 
          required 
          minlength="6"
          placeholder="••••••••">
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="loading || !registerForm.form.valid" class="btn-primary">
        {{ loading ? 'Registrando...' : 'Registrarse' }}
      </button>
      
      <div class="auth-footer">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </div>
    </form>
  </div>
</div>
