spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sbvia_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sbvia-api}
    audience: ${JWT_AUDIENCE:sbvia-web}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  cookie:
    # false en desarrollo (HTTP local). Establecer COOKIE_SECURE=true en producci��n (HTTPS)
    secure: ${COOKIE_SECURE:false}
  login:
    # OWASP A07: m�ximo de intentos fallidos y duraci�n del bloqueo (segundos)
    max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    lock-duration-seconds: ${LOGIN_LOCK_SECONDS:60}

ia:
  # Proveedor de retroalimentación: local (motor de reglas, por defecto) u openai
  # (API compatible con chat completions). La clave SOLO vive en variables de
  # entorno del backend; jamás en el frontend ni en el repositorio.
  proveedor: ${AI_PROVEEDOR:local}
  api-url: ${AI_API_URL:}
  api-key: ${AI_API_KEY:}
  modelo: ${AI_MODELO:gpt-4o-mini}
  timeout-segundos: ${AI_TIMEOUT_SEGUNDOS:15}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080
  servlet:
    context-path: /

logging:
  # OWASP A09: registro de eventos de seguridad (autenticación y autorización).
  level:
    root: INFO
    # Eventos de autenticación/autorización de Spring Security (login fallido, acceso denegado, etc.)
    org.springframework.security: INFO
    # Logs de eventos de seguridad propios (com.sbvia.backend.controller.AuthController)
    com.sbvia.backend: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
