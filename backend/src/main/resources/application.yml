spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sbvia_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sbvia-api}
    audience: ${JWT_AUDIENCE:sbvia-web}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  cookie:
    # false en desarrollo (HTTP local). Establecer COOKIE_SECURE=true en producción (HTTPS)
    secure: ${COOKIE_SECURE:false}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080
  servlet:
    context-path: /
